<g transform="translate(1310,930)"><polygon points="0,-62 15,0 0,-14 -15,0" fill="#3b2f22"/><polygon points="0,62 15,0 0,14 -15,0" fill="none" stroke="#3b2f22" stroke-width="2"/><text y="-72" text-anchor="middle" font-size="28" font-weight="bold" fill="#3b2f22">N</text></g>
</svg>
</g>

<g transform="translate(0,740)">
<text x="40" y="12" font-size="14" font-weight="bold" fill="#3b2f22">Key</text>
<rect x="40" y="22" width="14" height="14" fill="#d9a441" stroke="#3b2f22"/>
<text x="62" y="33" font-size="11" fill="#3b2f22">A Crying Claw (tavern, Warehouse District, on a hill above the docks)   B Silver Fish (rough tavern, docks)   C Seaside (posh waterfront tavern)</text>
<text x="62" y="47" font-size="11" fill="#3b2f22">D Dark She Looks Upon Me (eatery, Merchants District by the Governor District)   E Neely's Cheese (Slake Street, Living District)</text>
<rect x="40" y="56" width="14" height="14" fill="#b79ad0" stroke="#3b2f22"/><circle cx="80" cy="63" r="5" fill="#8fb0d6" stroke="#3b2f22"/>
<text x="92" y="67" font-size="11" fill="#3b2f22">Temples: L Lliira   T Tempus   S Silvanus   W Waukeen (beside S)   V Academia Vilhonus (south of the Generon)</text>
<rect x="40" y="80" width="14" height="9" fill="#9cc3d9" stroke="#4f86a8"/>
<text x="62" y="88" font-size="11" fill="#3b2f22">Canals and turning basin of the Port District (most roofed over as storm drains); the grid is schematic, the plan draws none.   Gold dome: Generon.</text>
<text x="40" y="108" font-size="10.5" font-style="italic" fill="#3b2f22">From the plan: ring road, coast and piers, walled block layout, the Emerald Corridor east to Iljak and the Golden Road south-west to Ormpetarr, the Generon, the Governor, Living, Warehouse, Merchants</text>
<text x="40" y="121" font-size="10.5" font-style="italic" fill="#3b2f22">and Port blocks and the three temple blocks. From the text only: tavern, eatery, Academia, Waukeen and cheese-shop spots. Not placed: Efusio's Cafe (rich quarter plaza), the Temple of Tymora.</text>
</g>
</svg>
