<text x="790" y="330" font-size="30" font-weight="bold" fill="#3b2f22" text-anchor="middle">Living District</text>
<text x="790" y="355" font-size="19" font-style="italic" fill="#3b2f22" text-anchor="middle">east</text>
<text x="330" y="800" font-size="30" font-weight="bold" fill="#3b2f22" text-anchor="middle">Merchants District</text>
<text x="580" y="500" font-size="21" font-weight="bold" fill="#3b2f22" text-anchor="middle">Governor</text>
<text x="580" y="523" font-size="21" font-weight="bold" fill="#3b2f22" text-anchor="middle">District</text>
<text x="580" y="440" font-size="20" font-style="italic" fill="#3b2f22" text-anchor="middle">Generon</text>
<text x="-60" y="225" font-size="30" font-weight="bold" fill="#3b2f22" text-anchor="middle">Port District</text>
<line x1="20" y1="230" x2="190" y2="300" stroke="#3b2f22" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="1290" y="430" font-size="24" fill="#6b5b45" text-anchor="middle" transform="rotate(-5 1290 430)">Emerald Corridor</text>
<text x="1330" y="520" font-size="22" font-style="italic" fill="#6b5b45" text-anchor="middle">to Iljak</text>
<text x="425" y="975" font-size="24" fill="#6b5b45" text-anchor="middle" transform="rotate(-74 425 975)">Golden Road</text>
<text x="510" y="990" font-size="22" font-style="italic" fill="#6b5b45" text-anchor="middle" transform="rotate(-74 510 990)">to Ormpetarr</text>
<text x="990" y="215" font-size="20" font-style="italic" fill="#6b5b45" text-anchor="middle">ring road</text>
<text x="1000" y="1000" font-size="19" font-style="italic" fill="#3b2f22" text-anchor="middle">noble manors (brown) stand by the outer walls</text>

