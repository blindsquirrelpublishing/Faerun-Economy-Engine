<text x="550" y="56" text-anchor="middle" font-size="12.5" font-style="italic" fill="#3b2f22">Redrawn by eye from the published city plan (blocks keyed 1 to 12 on the wiki's atlas version) and the written place descriptions. Block shapes and marker spots are approximate. Not to scale.</text>
