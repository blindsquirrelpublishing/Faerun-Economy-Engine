<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="title description">
  <title id="title">Red Larch working sketch</title>
  <desc id="description">Original schematic village map showing the Long Road, Cairn Road, Kheldell trail, nearby quarries, a spring-fed pond and relative positions of documented village landmarks. Not to scale.</desc>
  <defs>
    <pattern id="paper" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M0 34L34 0" stroke="#eadfc4" stroke-width="0.6" opacity=".5"/></pattern>
    <g id="house" fill="#98725a" stroke="#594838" stroke-width="1.5"><rect x="-11" y="-8" width="22" height="16" rx="2"/></g>
    <g id="tree" fill="#8caa71" stroke="#536b4c" stroke-width="1.2"><circle r="9"/></g>
    <g id="pit" fill="#c1ae90" stroke="#806d56" stroke-width="2"><ellipse rx="27" ry="16"/><path d="M-19 2Q0 -12 18 3M-12 9Q0 1 12 10" fill="none"/></g>
    <style>
      text { font-family: Georgia, 'DejaVu Serif', serif; fill: #3c3129; }
      .small { font-size: 13px; }
      .label { font-size: 15px; font-weight: bold; paint-order: stroke; stroke: #f5eedc; stroke-width: 4px; stroke-linejoin: round; }
      .road { fill: none; stroke: #b69970; stroke-width: 23; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: #c6ae8a; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
      .landmark { fill: #8e4c35; stroke: #f5eedc; stroke-width: 2; }
    </style>
  </defs>
