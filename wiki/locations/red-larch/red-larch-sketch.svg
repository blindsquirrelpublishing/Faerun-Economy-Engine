  <text class="small" x="913" y="475">page's cited descriptions.</text>
  <text class="small" x="913" y="516">* Pond location, side of road</text>
  <text class="small" x="913" y="537">for inns other than the</text>
  <text class="small" x="913" y="558">Swinging Sword, road bends,</text>
  <text class="small" x="913" y="579">buildings and plot shapes are</text>
  <text class="small" x="913" y="600">illustrative, not surveyed.</text>
  <text class="small" x="913" y="653">Older outlying sites are shown</text>
  <text class="small" x="913" y="674">for context, not as confirmed</text>
  <text class="small" x="913" y="695">1491 DR businesses.</text>
  <text x="913" y="765" font-size="13" font-style="italic">Original schematic · 2026-10-15</text>
</svg>
