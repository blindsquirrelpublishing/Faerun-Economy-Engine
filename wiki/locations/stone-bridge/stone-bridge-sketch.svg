<text x="40" y="880" font-size="10" fill="#6b5b45">East and west follow the Stone Trail (Westbridge west of the bridge, Beliard east). North is unconfirmed; the river's course here is not given in the sources.</text>
<text x="40" y="893" font-size="10" fill="#6b5b45">Drawn 2026-10-10 for the Faerun Economy Engine wiki. A reconstruction from text, not a copy of any published map. The engine places the bridge far from the Long Road (SB4).</text>
